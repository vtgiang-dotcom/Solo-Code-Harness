# Solo-Code Harness Configuration
# ================================
# This file overrides global defaults. Higher priority than ~/.solocode/settings.toml.
# Environment variables (SOLOCODE_*) have highest priority.

[hooks]
# Profile: "minimal" | "standard" | "strict"
profile = "standard"

[gates]
security = true
lint = true
schema = true
garden = true
test = true
guard = true

[skills]
auto_load = [
    "code-review-expert",
    "file-editor-pro",
    "systematic-debugging",
    "brainstorming",
    "testing-patterns",
    "api-patterns",
]
disabled = []

[models]
default = "deepseek-v4-pro[1m]"
fallback = "deepseek-v4-flash[1m]"

verify_on_commit = true
auto_verify_before_push = true

# Solo-Code Harness Manifest
# ===========================
# File này đánh dấu ranh giới giữa harness infrastructure và code dự án.
# AI Model: đọc file này trước khi phân tích codebase.
#
# MỌI FILE/THƯ MỤC trong [boundaries] là HARNESS — KHÔNG phải code dự án.
# Không sửa, không phân tích như logic nghiệp vụ.

[harness]
version = "4.0.0"
source = "solo-code-io/solo-code-cli"
generated_at = "2026-07-23T00:00:00Z"

# --- ENGINE STATUS (v4.0.0) ---
# .opencode/  -> REMOVED (was: 100%-parity generated mirror of .kilo/, zero
#                unique capability; its one non-mirrored asset, command/
#                ship.md, was ported to .kilo/command/ + .claude/commands/
#                before removal). Full history: .kilo/memory/MEMORY.md
#                "Decisions" section, 2026-07-23.
# jcode       -> Cost/latency-optimized worker engine for scriptable,
#                high-concurrency sub-tasks (DeepSeek v4 via CommandCode
#                gateway). No dedicated harness dir needed: reads AGENTS.md,
#                .claude/skills/ (fallback) and .mcp.json natively. Launcher:
#                jcode.ps1. Orchestrated by Claude Code (planner).
# .copilot/   -> NOT auto-generated. Manually kept in parity with .kilo/
#                (source of truth); verified by tools/garden.py drift checks.

[boundaries]
# Thư mục harness — KHÔNG chứa code dự án
dirs = [
    ".kilo",
    ".copilot",
    ".gemini",
    ".claude",
    ".claude-plugin",
    ".github",
    ".contracts",
    ".vscode",
    "tools",
]

# File gốc harness — KHÔNG phải code dự án
files = [
    "AGENTS.md",
    "CLAUDE.md",
    "agent.yaml",
    "kilo.jsonc",
    ".mcp.json",
    ".ruff.toml",
    ".gitleaks.toml",
    "Makefile",
    "pyproject.toml",
    "jcode.ps1",
    "claude-env.ps1",
    "verify.sh",
    "init.sh",
    "extensions_config.json",
    "SPEC.md",
    ".gitignore",
    ".pre-commit-config.yaml",
]

# File đánh dấu dành riêng cho harness
markers = [
    ".harness.lock",
    ".solocode",
]

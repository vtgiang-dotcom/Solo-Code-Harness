# Solo-Code Harness Manifest
# ===========================
# File này đánh dấu ranh giới giữa harness infrastructure và code dự án.
# AI Model: đọc file này trước khi phân tích codebase.
#
# MỌI FILE/THƯ MỤC trong [boundaries] là HARNESS — KHÔNG phải code dự án.
# Không sửa, không phân tích như logic nghiệp vụ.

[harness]
version = "3.7.0"
source = "solo-code-io/solo-code-cli"
generated_at = "2026-07-23T00:00:00Z"

# --- ENGINE STATUS (v3.7.0) ---
# .opencode/  -> DEPRECATED. Content is a 100%-parity generated mirror of
#                .kilo/ (agents, skills identical; verified via diff, 2026-07-23).
#                Its only non-mirrored asset (command/ship.md) has been ported
#                to .kilo/command/ship.md and .claude/commands/ship.md.
#                Scheduled for physical removal in v4.0.0 once CI stays green
#                for one full cycle without it. Do NOT add new content here.
# jcode       -> NEW cost/latency-optimized worker engine for scriptable,
#                high-concurrency sub-tasks (DeepSeek v4 via CommandCode
#                gateway). No dedicated harness dir needed: reads AGENTS.md,
#                .claude/skills/ (fallback) and .mcp.json natively. Launcher:
#                jcode.ps1. Orchestrated by Claude Code (planner) per
#                docs/decision: 2026-07-23 jcode-vs-opencode evaluation.

[boundaries]
# Thư mục harness — KHÔNG chứa code dự án
dirs = [
    ".kilo",
    ".opencode",  # deprecated, see [harness] note above — kept for CI parity until v4.0.0
    ".copilot",
    ".gemini",
    ".claude",
    ".claude-plugin",
    ".github",
    ".contracts",
    ".vscode",
    "tools",
]

# File gốc harness — KHÔNG phải code dự án
files = [
    "AGENTS.md",
    "CLAUDE.md",
    "agent.yaml",
    "kilo.jsonc",
    "opencode.json",
    ".mcp.json",
    ".ruff.toml",
    ".gitleaks.toml",
    "Makefile",
    "pyproject.toml",
    "opencode.ps1",   # deprecated, see [harness] note above
    "jcode.ps1",
    "claude-env.ps1",
    "verify.sh",
    "init.sh",
    "extensions_config.json",
    "SPEC.md",
    ".gitignore",
    ".pre-commit-config.yaml",
]

# File đánh dấu dành riêng cho harness
markers = [
    ".harness.lock",
    ".solocode",
]
